name: Build SDR++ TETRA-SCHWARTZ (AppImage + Windows + macOS)

on:
    push:
        branches:
        - 'main'
        - 'tetra-*'
    workflow_dispatch:

permissions:
    contents: write

# a newer push to the same branch replaces a running build (one release at a time)
concurrency:
    group: build-${{ github.ref }}
    cancel-in-progress: true

env:
    BUILD_TYPE: Release
    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:

    build_appimage:
        runs-on: ubuntu-24.04

        steps:
        - uses: actions/checkout@v4

        - name: Install dependencies
          run: |
            sudo apt-get update
            sudo apt-get install -y build-essential cmake ninja-build git unzip file xxd autoconf libtool \
                libfftw3-dev libglfw3-dev libvolk-dev libzstd-dev librtaudio-dev libpulse-dev portaudio19-dev \
                libairspyhf-dev libairspy-dev libiio-dev libad9361-dev libhackrf-dev librtlsdr-dev \
                libbladerf-dev liblimesuite-dev libuhd-dev libboost-dev libboost-thread-dev p7zip-full wget \
                libcodec2-dev libspdlog-dev liborc-0.4-dev libfuse2t64

        - name: Install SDRplay API (build only, not bundled in the AppImage)
          run: |
            wget -q https://www.sdrplay.com/software/SDRplay_RSP_API-Linux-3.15.2.run
            7z x -y ./SDRplay_RSP_API-Linux-3.15.2.run > /dev/null
            7z x -y ./SDRplay_RSP_API-Linux-3.15.2 > /dev/null
            sudo cp amd64/libsdrplay_api.so.3.15 /usr/lib/libsdrplay_api.so.3.15
            sudo ln -sf libsdrplay_api.so.3.15 /usr/lib/libsdrplay_api.so.3
            sudo ln -sf libsdrplay_api.so.3.15 /usr/lib/libsdrplay_api.so
            sudo cp inc/* /usr/include/
            sudo ldconfig

        - name: Configure
          run: >
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
            -DOPT_BUILD_NEW_PORTAUDIO_SINK=ON -DOPT_BUILD_M17_DECODER=ON
            -DOPT_BUILD_CH_EXTRAVHF_DECODER=ON -DOPT_BUILD_CH_TETRA_DEMODULATOR=ON
            -DOPT_BUILD_BLADERF_SOURCE=ON -DOPT_BUILD_LIMESDR_SOURCE=ON -DOPT_BUILD_SDRPLAY_SOURCE=ON
            -DOPT_BUILD_USRP_SOURCE=ON

        - name: Build
          run: |
            set -o pipefail
            cmake --build build -j4 2>&1 | tee build.log

        - name: Report compiler warnings in edition code
          if: always()
          run: |
            grep -E "warning:" build.log | grep -E "ch_tetra_demodulator|plutosdr_source|airspy_source|usrp_source|rtl_sdr_source|hackrf_source|bladerf_source|limesdr_source|sdrplay_source|audio_sink|pulseaudio|module_manager|menus/source|theme_manager|loading_screen|credits|waterfall|core\.cpp|tetra_" \
              | grep -v "/decoder/src/crypto/\|etsi_codec" | sort -u | head -40 | sed 's/^/::warning::/' || true
            echo "warnings in edition code: $(grep -E 'warning:' build.log | grep -cE 'ch_tetra_demodulator|plutosdr_source|module_manager|menus/source|theme_manager' || true)"

        - name: Read plugin version
          run: echo "TETRA_VERSION=$(sed -n 's/^#define TETRA_PLUGIN_VERSION "\([^"]*\)".*/\1/p' decoder_modules/ch_tetra_demodulator/src/measurements.h)" >> $GITHUB_ENV

        - name: Package AppImage
          run: |
            wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
            chmod +x linuxdeploy-x86_64.AppImage make_appimage.sh
            ./make_appimage.sh build ./linuxdeploy-x86_64.AppImage
            test -f AppDir/usr/lib/sdrpp/plugins/ch_tetra_demodulator.so
            for m in hackrf_source bladerf_source limesdr_source sdrplay_source usrp_source spectran_http_source; do
              test -f AppDir/usr/lib/sdrpp/plugins/$m.so || { echo "::error::$m missing"; exit 1; }
            done
            if ls AppDir/usr/lib/libsdrplay_api* > /dev/null 2>&1; then echo "::error::SDRplay API must not be bundled"; exit 1; fi

        - name: Save AppImage
          uses: actions/upload-artifact@v4
          with:
              name: SDRPP-TETRA-SCHWARTZ_v${{ env.TETRA_VERSION }}-beta_linux_appimage_x86_64
              path: SDRPP-TETRA-SCHWARTZ-v${{ env.TETRA_VERSION }}-beta-x86_64.AppImage

        - name: Headless tests (fresh start, TETRA chain with recording)
          run: |
            sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils python3-numpy > /dev/null
            mkdir -p e2eroot && ln -sfn "$PWD/AppDir/usr" e2eroot/inst
            export E2E_ROOT_DEV="$PWD/e2eroot" E2E_BUILD_DIR="$PWD/build" E2E_BINARY="$PWD/AppDir/usr/bin/sdrpp"
            export LD_LIBRARY_PATH="$PWD/AppDir/usr/lib" SDRPP_APPDIR="$PWD/AppDir" LIBGL_ALWAYS_SOFTWARE=1
            set +e
            xvfb-run -a -s "-screen 0 1600x1400x24" python3 e2e/test_tetra_schwartz.py 2>&1 | tee e2e.log
            rc=${PIPESTATUS[0]}
            set -e
            grep -E "FAIL|PASS|last measurements" e2e.log | sed 's/^/::notice::/' | head -20 || true
            if [ "$rc" != "0" ]; then
              echo "::error::headless tests failed"
              tail -60 e2e.log | cut -c1-300 | sed 's/^/::notice::/'
              exit 1
            fi

        - name: Documentation screenshots (branch doc-shots)
          if: github.ref == 'refs/heads/main'
          continue-on-error: true
          run: |
            export E2E_ROOT_DEV="$PWD/e2eroot" E2E_BUILD_DIR="$PWD/build" E2E_BINARY="$PWD/AppDir/usr/bin/sdrpp"
            export LD_LIBRARY_PATH="$PWD/AppDir/usr/lib" SDRPP_APPDIR="$PWD/AppDir" LIBGL_ALWAYS_SOFTWARE=1
            sudo apt-get install -y imagemagick > /dev/null
            mkdir -p docshots
            timeout 600 xvfb-run -a -s "-screen 0 1600x1000x24" python3 e2e/doc/doc_screenshots.py "$PWD/docshots" || true
            # example coverage maps (synthetic drive) rendered with the browser of the runner
            g++ -O1 -std=c++17 -Idecoder_modules/ch_tetra_demodulator/src e2e/doc/doc_map.cpp -o doc_map
            (cd docshots && ../doc_map drive.csv)
            for m in level quality; do
              timeout 120 google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1400,900 \
                --virtual-time-budget=20000 --screenshot="docshots/map_$m.png" "file://$PWD/docshots/drive_${m}_map.html" || true
            done
            # measurement report (figure in chapter 15), rendered like the maps
            if [ -f docshots/report.html ]; then
              timeout 120 google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1100,1500 \
                --virtual-time-budget=10000 --screenshot="docshots/report.png" "file://$PWD/docshots/report.html" || true
            fi
            ls -la docshots
            cd docshots
            git init -q
            git checkout -q -b doc-shots
            git add -A
            git -c user.name=UnImAtrIXzEr0 -c user.email=UnImAtrIXzEr0@users.noreply.github.com commit -qm "Screenshots for the manual"
            git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" doc-shots

        - name: Manuals (PDF, German and English)
          continue-on-error: true
          run: |
            python3 -m pip install -q --break-system-packages playwright pypdf || python3 -m pip install -q playwright pypdf
            mkdir -p docs/manual/shots manuals
            if ls docshots/*.png > /dev/null 2>&1; then cp docshots/*.png docs/manual/shots/
            else
              git fetch -q origin doc-shots:refs/remotes/origin/doc-shots && git archive refs/remotes/origin/doc-shots | tar -x -C docs/manual/shots || true
            fi
            MANUAL_CHROME="$(command -v google-chrome || command -v chromium || true)" python3 docs/manual/build_manual.py "$PWD/manuals"
            ls -la manuals

        - name: Save manuals
          if: always()
          continue-on-error: true
          uses: actions/upload-artifact@v4
          with:
              name: SDRPP-TETRA-SCHWARTZ_v${{ env.TETRA_VERSION }}-beta_manuals_pdf
              path: manuals/*.pdf
              if-no-files-found: ignore

    build_windows:
        if: ${{ !contains(github.ref_name, 'macos') }}
        runs-on: windows-2022

        steps:
        - uses: actions/checkout@v4

        - name: Create Build Environment
          run: cmake -E make_directory ${{runner.workspace}}/build

        - name: Download dependency cache
          shell: pwsh
          env:
            GH_TOKEN: ${{ github.token }}
          run: |
            New-Item -ItemType Directory ${{runner.workspace}}/cache -Force | Out-Null
            $null = gh release view build-cache --repo $env:GITHUB_REPOSITORY 2>&1
            if ($LASTEXITCODE -eq 0) {
              $null = gh release download build-cache `
                --repo $env:GITHUB_REPOSITORY `
                --pattern "*.zip" `
                --dir ${{runner.workspace}}/cache 2>&1
              if ($LASTEXITCODE -ne 0) { Write-Host "cache download failed, building from source" }
            } else {
              Write-Host "no build-cache release found, building from source"
            }
            Write-Host "cache:"; Get-ChildItem ${{runner.workspace}}/cache -ErrorAction SilentlyContinue | Select-Object Name,Length
            exit 0

        - name: Restore vcpkg binary cache
          shell: pwsh
          run: |
            $zip = "${{runner.workspace}}/cache/vcpkg-cache.zip"
            if (Test-Path $zip) {
              Expand-Archive $zip -DestinationPath C:/ -Force
              "CACHE_VCPKG=restored" | Out-File -FilePath $env:GITHUB_ENV -Append
              Write-Host "vcpkg binary cache restored - vcpkg install will reuse it incrementally"
            } else {
              "CACHE_VCPKG=missing" | Out-File -FilePath $env:GITHUB_ENV -Append
              Write-Host "vcpkg binary cache missing - building boost + friends from source"
            }
            $uhdZip = "${{runner.workspace}}/cache/uhd-3.15.0.0-x64.zip"
            if (Test-Path $uhdZip) {
              Expand-Archive $uhdZip -DestinationPath "C:/Program Files" -Force
              "CACHE_UHD=restored" | Out-File -FilePath $env:GITHUB_ENV -Append
              Write-Host "UHD restored to C:/Program Files/uhd"
            } else {
              "CACHE_UHD=missing" | Out-File -FilePath $env:GITHUB_ENV -Append
              Write-Host "UHD cache missing - build-uhd action will compile from source"
            }
            $pyZip = "${{runner.workspace}}/cache/uhd-python311-codegen.zip"
            if (Test-Path $pyZip) {
              Expand-Archive $pyZip -DestinationPath C:/dev -Force
              "CACHE_PY=restored" | Out-File -FilePath $env:GITHUB_ENV -Append
              Write-Host "Python 3.11 restored to C:/dev/py311_uhd"
            } else {
              "CACHE_PY=missing" | Out-File -FilePath $env:GITHUB_ENV -Append
              Write-Host "Python cache missing - will use setup-python 3.11"
            }

        - name: Restore MinGW toolchain
          shell: pwsh
          run: |
            $zip = "${{runner.workspace}}/cache/mingw64-codec2.zip"
            if (Test-Path $zip) {
              & 7z x $zip -oC:/ -y *> $null
              "CACHE_MINGW=restored" | Out-File -FilePath $env:GITHUB_ENV -Append
              Write-Host "MinGW toolchain restored to C:/msys64 - skipping pacman"
            } else {
              "CACHE_MINGW=missing" | Out-File -FilePath $env:GITHUB_ENV -Append
              Write-Host "MinGW cache missing - pacman will install toolchain"
            }

        - name: Download PothosSDR
          run: Invoke-WebRequest -Uri "https://downloads.myriadrf.org/builds/PothosSDR/PothosSDR-2020.01.26-vc14-x64.exe" -OutFile ${{runner.workspace}}/pothos.exe

        - name: Install PothosSDR
          run: mkdir "C:/Program Files/PothosSDR" ; 7z x ${{runner.workspace}}/pothos.exe -o"C:/Program Files/PothosSDR/"

        - name: Download libusb
          run: Invoke-WebRequest -Uri "https://github.com/libusb/libusb/releases/download/v1.0.23/libusb-1.0.23.7z" -OutFile ${{runner.workspace}}/libusb.7z

        - name: Patch Pothos with earlier libusb version
          working-directory: ${{runner.workspace}}
          run: 7z x libusb.7z -olibusb_old ; rm "C:/Program Files/PothosSDR/bin/libusb-1.0.dll" ; cp "libusb_old/MS64/dll/libusb-1.0.dll" "C:/Program Files/PothosSDR/bin/" ; rm "C:/Program Files/PothosSDR/lib/libusb-1.0.lib" ; cp "libusb_old/MS64/dll/libusb-1.0.lib" "C:/Program Files/PothosSDR/lib/"

        - name: Download librtlsdr
          run: Invoke-WebRequest -Uri "https://ftp.osmocom.org/binaries/windows/rtl-sdr/rtl-sdr-64bit-20240623.zip" -OutFile ${{runner.workspace}}/rtl-sdr.zip

        - name: Patch Pothos with newer librtlsdr version
          working-directory: ${{runner.workspace}}
          run: 7z x rtl-sdr.zip ; rm "C:/Program Files/PothosSDR/bin/rtlsdr.dll" ; cp "rtl-sdr-64bit-20240623/librtlsdr.dll" "C:/Program Files/PothosSDR/bin/rtlsdr.dll"

        - name: Download SDRPlay API
          run: Invoke-WebRequest -Uri "https://www.sdrpp.org/SDRplay.zip" -OutFile ${{runner.workspace}}/SDRplay.zip

        - name: Install SDRPlay API
          run: 7z x ${{runner.workspace}}/SDRplay.zip -o"C:/Program Files/"

        - name: Download codec2
          run: git clone https://github.com/drowe67/codec2

        - name: Prepare MinGW
          if: env.CACHE_MINGW != 'restored'
          run: C:/msys64/msys2_shell.cmd -defterm -here -no-start -mingw64 -c "pacman --noconfirm -S --needed base-devel mingw-w64-x86_64-toolchain mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja"

        - name: Prepare build for codec2
          run: cd codec2 ; mkdir build ; cd build ; C:/msys64/msys2_shell.cmd -defterm -here -no-start -mingw64 -c "cmake .. -DCMAKE_GNUtoMS=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-static-libgcc"

        - name: Build codec2
          run: cd codec2/build ; C:/msys64/msys2_shell.cmd -defterm -here -no-start -mingw64 -c "ninja"

        - name: Install codec2
          run: mkdir "C:/Program Files/codec2" ; mkdir "C:/Program Files/codec2/include" ; mkdir "C:/Program Files/codec2/include/codec2" ; mkdir "C:/Program Files/codec2/lib" ; cd "codec2" ; xcopy "src" "C:/Program Files/codec2/include" ; cd "build" ; xcopy "src" "C:/Program Files/codec2/lib" ; xcopy "codec2" "C:/Program Files/codec2/include/codec2"

        - name: Install vcpkg dependencies (release x64 only, binary-cached)
          shell: pwsh
          env:
            VCPKG_BINARY_SOURCES: "files,C:/vcpkg-cache,readwrite"
          run: |
            try {
              git -C C:/vcpkg fetch origin 39344dff01c5a5a0134caf2624cdd492f05d30ea 2>$null
              git -C C:/vcpkg checkout 39344dff01c5a5a0134caf2624cdd492f05d30ea
              C:/vcpkg/bootstrap-vcpkg.bat -disableMetrics
              Write-Host "vcpkg pinned to cache-producing revision 39344dff01"
            } catch {
              Write-Host "vcpkg pin failed (best effort); using runner default"
            }
            $trip = "C:/vcpkg/triplets/x64-windows.cmake"
            if (-not (Select-String -Path $trip -Pattern "VCPKG_BUILD_TYPE" -Quiet)) {
              Add-Content -Path $trip -Value "set(VCPKG_BUILD_TYPE release)"
              Write-Host "x64-windows triplet forced to release-only (no debug build)"
            }
            $snap = 0
            if (Test-Path C:/vcpkg-cache) {
              $snap = (Get-ChildItem C:/vcpkg-cache -Recurse -File | Measure-Object -Property Length -Sum).Sum
            }
            vcpkg install fftw3:x64-windows glfw3:x64-windows portaudio:x64-windows zstd:x64-windows libusb:x64-windows itpp:x64-windows spdlog:x64-windows boost:x64-windows
            $now = 0
            if (Test-Path C:/vcpkg-cache) {
              $now = (Get-ChildItem C:/vcpkg-cache -Recurse -File | Measure-Object -Property Length -Sum).Sum
            }
            "CACHE_VCPKG_CHANGED=" + (($now -ne $snap) -or ($snap -eq 0)) | Out-File -FilePath $env:GITHUB_ENV -Append

        - name: Setup Python 3.11 (UHD codegen)
          id: setup-python
          if: env.CACHE_UHD != 'restored'
          uses: actions/setup-python@v5
          with:
            python-version: '3.11'

        - name: Build UHD 3.15.0.0
          if: env.CACHE_UHD != 'restored'
          uses: ./.github/actions/build-uhd

        - name: Upload dependency cache
          if: always() && github.event_name == 'push' && (env.CACHE_VCPKG_CHANGED == 'True' || env.CACHE_UHD == 'missing' || env.CACHE_PY == 'missing' || env.CACHE_MINGW == 'missing')
          shell: pwsh
          env:
            GH_TOKEN: ${{ github.token }}
          run: |
            $7z = "C:\Program Files\7-Zip\7z.exe"
            $cache = "${{runner.workspace}}/cache"
            if (Test-Path C:/vcpkg-cache) {
              & $7z a -tzip -mmt4 -mx5 "$cache/vcpkg-cache.zip" C:/vcpkg-cache *> "$cache/zip_cache.log"
              Write-Host "zipped vcpkg binary cache"
            }
            if (Test-Path "C:/Program Files/uhd") {
              & $7z a -tzip -mmt4 -mx5 "$cache/uhd-3.15.0.0-x64.zip" "C:/Program Files/uhd" *> "$cache/zip_uhd.log"
              Write-Host "zipped UHD install"
            }
            if (Test-Path "C:/msys64/msys2_shell.cmd") {
              & C:/msys64/msys2_shell.cmd -defterm -here -no-start -mingw64 -c "pacman -Scc --noconfirm"
              Push-Location C:/
              & $7z a -tzip -mmt4 -mx5 "$cache/mingw64-codec2.zip" msys64 *> "$cache/zip_mingw.log"
              Pop-Location
              Write-Host "zipped full MinGW tree (pacman cache cleaned)"
            }
            $pyDir = "C:/dev/py311_uhd"
            $hasDistutils = python -c "import distutils" 2>$null
            if ($LASTEXITCODE -eq 0) {
              if (-not (Test-Path "$pyDir/python.exe")) {
                $pref = python -c "import sys; print(sys.exec_prefix)"
                New-Item -ItemType Directory C:/dev -Force | Out-Null
                Copy-Item $pref $pyDir -Recurse -Force
                Write-Host "copied python $pref -> $pyDir"
              }
            } else {
              Write-Host "current python has no distutils - skipping python cache"
            }
            if (Test-Path "$pyDir/python.exe") {
              & $7z a -tzip -mmt4 -mx5 "$cache/uhd-python311-codegen.zip" $pyDir *> "$cache/zip_py.log"
              Write-Host "zipped python codegen env"
            }
            gh release view build-cache --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
            if ($LASTEXITCODE -ne 0) {
              gh release create build-cache --repo $env:GITHUB_REPOSITORY --title "Windows build cache" --notes "CI-built incremental dependency cache (vcpkg binary cache, UHD 3.15, python 3.11)." 2>$null
            }
            $toUpload = @()
            foreach ($z in @("vcpkg-cache.zip","mingw64-codec2.zip","uhd-3.15.0.0-x64.zip","uhd-python311-codegen.zip")) {
              if (Test-Path "$cache/$z") { $toUpload += "$cache/$z" } else { Write-Host "skip upload of missing $z" }
            }
            if ($toUpload.Count -gt 0) {
              gh release upload build-cache --repo $env:GITHUB_REPOSITORY --clobber @($toUpload)
              Write-Host "dependency cache uploaded to build-cache release"
            } else {
              Write-Host "nothing to upload"
            }

        - name: Install rtaudio
          run: git clone https://github.com/thestk/rtaudio ; cd rtaudio ; git checkout 2f2fca4502d506abc50f6d4473b2836d24cfb1e3 ; mkdir build ; cd build ; cmake .. ; cmake --build . --config Release ; cmake --install .

        - name: Install libperseus-sdr
          run: git clone https://github.com/AlexandreRouma/libperseus-sdr ; cd libperseus-sdr ; mkdir build ; cd build ; cmake -DCMAKE_BUILD_TYPE=Release "-DLIBUSB_LIBRARIES=C:/Program Files/PothosSDR/lib/libusb-1.0.lib" "-DLIBUSB_INCLUDE_DIRS=C:/Program Files/PothosSDR/include/libusb-1.0" .. "-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake" ; cmake --build . --config Release  ; mkdir "C:/Program Files/PothosSDR/include/perseus-sdr" ; cp Release/perseus-sdr.dll "C:/Program Files/PothosSDR/bin" ; cp Release/perseus-sdr.lib "C:/Program Files/PothosSDR/bin" ; cd .. ; xcopy "src" "C:/Program Files/PothosSDR/include/perseus-sdr"

        - name: Install librfnm
          run: git clone https://github.com/AlexandreRouma/librfnm ; cd librfnm ; mkdir build ; cd build ; cmake .. -DCMAKE_BUILD_TYPE=Release "-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake" ; cmake --build . --config Release ; cmake --install .

        - name: Install libfobos
          run: git clone https://github.com/AlexandreRouma/libfobos ; cd libfobos ; mkdir build ; cd build ; cmake .. -DCMAKE_BUILD_TYPE=Release "-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake" ; cmake --build . --config Release ; cmake --install .

        - name: Install libhydrasdr
          run: git clone https://github.com/hydrasdr/rfone_host; cd rfone_host/ ; mkdir build ; cd build ; cmake .. -DCMAKE_BUILD_TYPE=Release "-DLIBUSB_LIBRARIES=C:\Program Files\PothosSDR\lib\libusb-1.0.lib" "-DLIBUSB_INCLUDE_DIR=C:\Program Files\PothosSDR\include\libusb-1.0" "-DTHREADS_PTHREADS_WIN32_LIBRARY=C:\Program Files\PothosSDR\lib\pthreadVC2.lib" "-DTHREADS_PTHREADS_INCLUDE_DIR=C:\Program Files\PothosSDR\include" -DCMAKE_INSTALL_PREFIX="C:/Program Files/hydrasdr-host" ; cmake --build . --config Release ; cmake --install .

        - name: Prepare CMake
          working-directory: ${{runner.workspace}}/build
          run: cmake -DCOPY_MSVC_REDISTRIBUTABLES=ON "$Env:GITHUB_WORKSPACE" "-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake" -DOPT_BUILD_BLADERF_SOURCE=ON -DOPT_BUILD_LIMESDR_SOURCE=ON -DOPT_BUILD_PERSEUS_SOURCE=ON -DOPT_BUILD_SDRPLAY_SOURCE=ON -DOPT_BUILD_NEW_PORTAUDIO_SINK=ON -DOPT_BUILD_M17_DECODER=ON -DOPT_BUILD_RFNM_SOURCE=ON -DOPT_BUILD_FOBOSSDR_SOURCE=ON -DOPT_BUILD_HYDRASDR_SOURCE=ON -DOPT_BUILD_CH_EXTRAVHF_DECODER=ON -DOPT_BUILD_SOAPY_SOURCE=ON -DOPT_BUILD_MPEG_ADTS_SINK=OFF -DOPT_BUILD_USRP_SOURCE=ON -DUHD_DIR="C:/Program Files/uhd"

        - name: Build
          working-directory: ${{runner.workspace}}/build
          shell: pwsh
          run: |
            cmake --build . --config RelWithDebInfo 2>&1 | Tee-Object -FilePath build.log
            if ($LASTEXITCODE -ne 0) {
              # Surface compiler errors as annotations (readable via the API)
              Select-String -Path build.log -Pattern 'error [A-Z]+[0-9]+|fatal error|: error' |
                Select-Object -First 30 | ForEach-Object {
                  $m = $_.Line -replace '[\r\n]', ' '
                  if ($m.Length -gt 400) { $m = $m.Substring(0, 400) }
                  Write-Output "::error::$m"
                }
              exit 1
            }

        - name: Report compiler warnings in edition code
          if: always()
          working-directory: ${{runner.workspace}}/build
          shell: pwsh
          run: |
            if (Test-Path build.log) {
              # unique source locations (the same header warning repeats per project)
              $w = Select-String -Path build.log -Pattern 'warning C[0-9]+' |
                ForEach-Object { $_.Line -replace '[\r\n]', ' ' } |
                Where-Object { $_ -match 'ch_tetra_demodulator|plutosdr_source|airspy_source|usrp_source|rtl_sdr_source|audio_sink|module_manager|menus\\source|theme_manager|loading_screen|credits|core\.cpp' } |
                ForEach-Object { if ($_ -match '([A-Za-z0-9_\\.\-]+\(\d+,\d+\)): warning (C\d+)') { ($matches[1] -replace '^.*sdrpp-tetra-schwartz\\', '') + ' ' + $matches[2] } } |
                Sort-Object -Unique
              Write-Host "warning locations: $($w.Count)"
              $w | ForEach-Object { Write-Host $_ }
              if ($w.Count -gt 0) {
                $all = ($w | Select-Object -First 60) -join ' ; '
                Write-Output "::warning::$($w.Count) warning locations: $all"
              }
            }

        - name: Create Archive
          working-directory: ${{runner.workspace}}
          run: '&($Env:GITHUB_WORKSPACE + "/make_windows_package.ps1") ./build ($Env:GITHUB_WORKSPACE + "/root")'

        - name: Read plugin version
          shell: bash
          run: echo "TETRA_VERSION=$(sed -n 's/^#define TETRA_PLUGIN_VERSION "\([^"]*\)".*/\1/p' decoder_modules/ch_tetra_demodulator/src/measurements.h)" >> $GITHUB_ENV

        - name: Save Archive
          uses: actions/upload-artifact@v4
          with:
              name: SDRPP-TETRA-SCHWARTZ_v${{ env.TETRA_VERSION }}-beta_windows_x64
              path: ${{runner.workspace}}/sdrpp_windows_x64.zip

    build_macos_arm64:
        # light build: only RTL-SDR (+ RTL-TCP) and MSi2500 (SoapySDR + SoapyMiri), TETRA, recorder
        runs-on: macos-14

        env:
            HOMEBREW_NO_AUTO_UPDATE: 1
            HOMEBREW_NO_INSTALL_CLEANUP: 1

        steps:
        - uses: actions/checkout@v4

        - name: Install dependencies
          run: brew install cmake ninja pkgconf fftw glfw volk zstd libusb librtlsdr rtaudio soapysdr

        - name: Build MSi2500 driver (libmirisdr-5 + SoapyMiri)
          run: |
            MIRI="$PWD/miri-prefix"
            git clone --depth 1 https://github.com/ericek111/libmirisdr-5
            cmake -S libmirisdr-5 -B libmirisdr-5/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="$MIRI" -DCMAKE_INSTALL_NAME_DIR="$MIRI/lib" -DCMAKE_PREFIX_PATH=/opt/homebrew
            cmake --build libmirisdr-5/build && cmake --install libmirisdr-5/build
            git clone --depth 1 https://github.com/ericek111/SoapyMiri
            PKG_CONFIG_PATH="$MIRI/lib/pkgconfig" cmake -S SoapyMiri -B SoapyMiri/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="$MIRI" -DCMAKE_PREFIX_PATH="$MIRI;/opt/homebrew" -DCMAKE_INSTALL_RPATH="$MIRI/lib"
            cmake --build SoapyMiri/build && cmake --install SoapyMiri/build
            find "$MIRI" -name "*.so" -o -name "*.dylib" | sed 's/^/::notice::/'

        - name: Configure
          run: >
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
            -DUSE_BUNDLE_DEFAULTS=ON
            -DOPT_BUILD_RTL_SDR_SOURCE=ON -DOPT_BUILD_RTL_TCP_SOURCE=ON -DOPT_BUILD_SOAPY_SOURCE=ON -DOPT_BUILD_FILE_SOURCE=ON
            -DOPT_BUILD_AIRSPY_SOURCE=OFF -DOPT_BUILD_AIRSPYHF_SOURCE=OFF -DOPT_BUILD_AUDIO_SOURCE=OFF
            -DOPT_BUILD_HACKRF_SOURCE=OFF -DOPT_BUILD_HERMES_SOURCE=OFF -DOPT_BUILD_NETWORK_SOURCE=OFF
            -DOPT_BUILD_PLUTOSDR_SOURCE=OFF -DOPT_BUILD_RFSPACE_SOURCE=OFF -DOPT_BUILD_SDRPP_SERVER_SOURCE=OFF
            -DOPT_BUILD_SPECTRAN_HTTP_SOURCE=OFF -DOPT_BUILD_SPYSERVER_SOURCE=OFF -DOPT_BUILD_HL2_SOURCE=OFF
            -DOPT_BUILD_KIWISDR_SOURCE=OFF
            -DOPT_BUILD_AUDIO_SINK=ON -DOPT_BUILD_NETWORK_SINK=OFF -DOPT_BUILD_MPEG_ADTS_SINK=OFF
            -DOPT_BUILD_NEW_PORTAUDIO_SINK=OFF -DOPT_BUILD_PORTAUDIO_SINK=OFF
            -DOPT_BUILD_CH_TETRA_DEMODULATOR=ON -DOPT_BUILD_RADIO=ON
            -DOPT_BUILD_ATV_DECODER=OFF -DOPT_BUILD_CH_EXTRAVHF_DECODER=OFF -DOPT_BUILD_FT8_DECODER=OFF
            -DOPT_BUILD_METEOR_DEMODULATOR=OFF -DOPT_BUILD_PAGER_DECODER=OFF -DOPT_BUILD_M17_DECODER=OFF
            -DOPT_BUILD_FREQUENCY_MANAGER=ON -DOPT_BUILD_RECORDER=ON
            -DOPT_BUILD_DISCORD_PRESENCE=OFF -DOPT_BUILD_IQ_EXPORTER=OFF -DOPT_BUILD_RIGCTL_CLIENT=OFF
            -DOPT_BUILD_RIGCTL_SERVER=OFF -DOPT_BUILD_TCI_SERVER=OFF -DOPT_BUILD_SCANNER=OFF
            -DOPT_BUILD_NOISE_REDUCTION_LOGMMSE=OFF

        - name: Build
          run: |
            set -o pipefail
            cmake --build build -j4 2>&1 | tee build.log

        - name: Read plugin version
          run: echo "TETRA_VERSION=$(sed -n 's/^#define TETRA_PLUGIN_VERSION "\([^"]*\)".*/\1/p' decoder_modules/ch_tetra_demodulator/src/measurements.h)" >> $GITHUB_ENV

        - name: Package .app and .dmg
          run: |
            APP="SDR++ TETRA-SCHWARTZ.app"
            bash make_macos_bundle.sh build sdrpp.app > bundle.log 2>&1 || { tail -40 bundle.log; exit 1; }
            # MSi2500 driver as a SoapySDR module inside the bundle (path set in src/macos_init.m)
            source macos/bundle_utils.sh
            mkdir -p sdrpp.app/Contents/Plugins/SoapySDR
            for m in miri-prefix/lib/SoapySDR/modules*/*.so; do
              bundle_install_binary sdrpp.app sdrpp.app/Contents/Plugins/SoapySDR "$m" >> bundle.log 2>&1
              install_name_tool -add_rpath @loader_path/../../Frameworks "sdrpp.app/Contents/Plugins/SoapySDR/$(basename "$m")"
            done
            # bundled libraries keep their Homebrew install id, point it to the bundle
            for f in sdrpp.app/Contents/Frameworks/*.dylib; do
              install_name_tool -id "@rpath/$(basename "$f")" "$f"
            done
            bundle_sign sdrpp.app
            for m in rtl_sdr_source soapy_source ch_tetra_demodulator; do
              test -f sdrpp.app/Contents/Plugins/$m.dylib || { echo "::error::$m missing"; exit 1; }
            done
            ls sdrpp.app/Contents/Plugins/SoapySDR/*.so > /dev/null || { echo "::error::MSi2500 Soapy module missing"; exit 1; }
            # every library must come from the bundle, nothing from Homebrew
            if find sdrpp.app -type f \( -name "*.dylib" -o -name "*.so" -o -name sdrpp \) -exec otool -L {} \; | grep -E "/opt/homebrew|/usr/local|miri-prefix"; then
              echo "::error::bundle references libraries outside the .app"; exit 1
            fi
            mv sdrpp.app "$APP"
            mkdir dmg && mv "$APP" dmg/ && ln -s /Applications dmg/Applications
            hdiutil create -volname "SDR++ TETRA-SCHWARTZ" -srcfolder dmg -ov -format ULMO \
              "SDRPP-TETRA-SCHWARTZ-v${TETRA_VERSION}-beta-macos-arm64.dmg"
            ls -la *.dmg

        - name: Save DMG
          uses: actions/upload-artifact@v4
          with:
              name: SDRPP-TETRA-SCHWARTZ_v${{ env.TETRA_VERSION }}-beta_macos_arm64
              path: SDRPP-TETRA-SCHWARTZ-v${{ env.TETRA_VERSION }}-beta-macos-arm64.dmg


    release:
        # every green build of main is published as a GitHub release (downloads
        # without a GitHub account and without the 90-day limit of artifacts)
        if: github.ref == 'refs/heads/main'
        needs: [build_appimage, build_windows, build_macos_arm64]
        runs-on: ubuntu-24.04
        steps:
        - uses: actions/checkout@v4

        - name: Read plugin version
          run: echo "TETRA_VERSION=$(sed -n 's/^#define TETRA_PLUGIN_VERSION "\([^"]*\)".*/\1/p' decoder_modules/ch_tetra_demodulator/src/measurements.h)" >> $GITHUB_ENV

        - name: Collect builds and manuals
          uses: actions/download-artifact@v4
          with:
              path: dl

        - name: Publish release
          run: |
            V="v${TETRA_VERSION}-beta"
            mkdir -p rel
            cp dl/*windows_x64/sdrpp_windows_x64.zip "rel/SDRPP-TETRA-SCHWARTZ_${V}_windows_x64.zip"
            cp dl/*linux_appimage_x86_64/*.AppImage "rel/SDRPP-TETRA-SCHWARTZ_${V}_x86_64.AppImage"
            cp dl/*macos_arm64/*.dmg "rel/SDRPP-TETRA-SCHWARTZ_${V}_macos_arm64.dmg"
            cp dl/*manuals_pdf/*.pdf rel/ 2>/dev/null || echo "::warning::no manuals in this run"
            (cd rel && sha256sum * > SHA256SUMS.txt)
            ls -la rel
            NOTES="Experimental beta for amateur radio TETRA. Windows: unpack the zip and start sdrpp.exe. Linux: chmod +x the AppImage and start it. macOS (Apple Silicon, macOS 14+, light build: RTL-SDR and MSi2500): drag the app to Applications, then run xattr -dr com.apple.quarantine \"/Applications/SDR++ TETRA-SCHWARTZ.app\" once (unsigned build). Manuals (German / English) as PDF. Changes: see the commit history. Check the downloads with SHA256SUMS.txt."
            # a rebuild of the same version replaces its release (tag on the newest commit)
            if gh release view "$V" > /dev/null 2>&1; then gh release delete "$V" --cleanup-tag -y; fi
            gh release create "$V" rel/* --target "$GITHUB_SHA" --title "SDR++ TETRA-SCHWARTZ $V" --notes "$NOTES" --latest
            # the dependency cache release must not keep old history reachable
            git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA:refs/tags/build-cache" || true
